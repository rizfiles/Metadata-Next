<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metadata-Next</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Metadata-Next</h1>
  <div class="group">
    <button class="btn" id="set">API Key</button>
    <button class="toggle" id="mode" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="knob">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </span>
    </button>
  </div>
</header>
<main>
  <section class="box">
    <div class="toolbar">
      <div class="group">
        <button class="btn" id="upload">Upload</button>
        <button class="btn sq" id="clear" aria-label="Delete all images" hidden><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M8 6V4h8v2"/><path d="M10 11v6M14 11v6"/></svg></button>
      </div>
      <div class="group right">
        <button class="btn" id="gen" hidden>Generate</button>
        <button class="btn" id="dl" hidden>Download</button>
      </div>
    </div>
    <div class="scroll"><div class="grid" id="grid"></div></div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </section>
</main>
<section class="logp" id="logp">
  <div class="pbox min" id="pbox">
    <div class="lh"><strong>LOG</strong><div class="group"><button class="btn" id="lcopy">Copy</button><button class="btn" id="lclr">Clear</button><button class="btn" id="ltog">Show</button></div></div>
    <div class="lb" id="log" role="log"></div>
  </div>
</section>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mT" hidden>
  <div class="mbox"><h2 id="mT"></h2><div id="mB" style="display:flex;flex-direction:column;gap:12px"></div><div class="btns" id="mX"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
