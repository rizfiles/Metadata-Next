<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metadata-Next</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#333333; color-scheme:light;
  --font:"Google Sans Flex",sans-serif;
  --pad:clamp(16px,5.6vw,108px);
  --h:clamp(40px,5vh,54px);
}
:root[data-theme="dark"]{--bg:#333333;--ink:#FFFFFF;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);scrollbar-color:var(--ink) var(--bg)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;flex:none}

header{background:var(--ink);color:var(--bg);padding:env(safe-area-inset-top,0px) var(--pad) 0;height:calc(clamp(60px,10vh,108px) + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;flex:none}
header h1{font-size:clamp(20px,2.1vw,40px);font-weight:700;letter-spacing:-.3px}

.toggle{position:relative;width:clamp(56px,4.8vw,93px);height:clamp(28px,2.4vw,46px);border:0;background:var(--bg);cursor:pointer}
.knob{position:absolute;top:12%;bottom:12%;aspect-ratio:1/1;right:6%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:right .25s,left .25s}
:root[data-theme="dark"] .knob{right:auto;left:6%}
.knob svg{width:58%;height:58%;position:absolute;transition:opacity .2s}
.knob .moon{opacity:0}
:root[data-theme="dark"] .knob .sun{opacity:0}
:root[data-theme="dark"] .knob .moon{opacity:1}
.toggle:focus-visible{outline:2px solid var(--bg);outline-offset:2px}

main{flex:1;min-height:0;padding:clamp(16px,5vh,54px) var(--pad)}
.box{height:100%;min-height:340px;border:4px solid var(--ink);padding:clamp(12px,1.15vw,22px);display:flex;flex-direction:column}

.toolbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-bottom:clamp(14px,2.5vh,27px);border-bottom:1px solid var(--ink);flex:none}
.group{display:flex;align-items:center;gap:clamp(8px,1vw,18px)}
.group.right{justify-content:flex-end}
.count{font-size:clamp(14px,1.05vw,20px);text-transform:uppercase;white-space:nowrap;text-align:center}
.btn{height:var(--h);padding:0 clamp(14px,1.1vw,21px);border:0;background:var(--ink);color:var(--bg);font-size:clamp(14px,1.05vw,20px);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn.sq{width:var(--h);padding:0}
.btn:active,.del:active{opacity:.85}
.btn:focus-visible,.del:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.scroll{flex:1;min-height:0;overflow-y:auto;padding-top:clamp(14px,2.5vh,27px);scrollbar-color:var(--ink) var(--bg)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,1.6vw,30px)}
.card{display:flex;flex-direction:column}
.tile{aspect-ratio:1/1;background:var(--bg);overflow:hidden;border:1px solid var(--ink);border-bottom:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.del{width:100%;height:clamp(24px,3.2vh,38px);border:0;background:var(--ink);color:var(--bg);font-size:clamp(10px,.95vw,16px);font-weight:500;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(51,51,51,.6)}
.mbox{background:var(--bg);color:var(--ink);border:2px solid var(--ink);padding:clamp(16px,1.6vw,28px);width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
.mbox h2{font-size:clamp(16px,1.3vw,22px);font-weight:700}
.mbox p{font-size:clamp(14px,1vw,17px);line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.mbox .btn{align-self:flex-end}

@media (max-width:720px){
  .toolbar{grid-template-columns:1fr auto}
  .count{grid-column:1/-1;grid-row:1}
}
</style>
</head>
<body>
<header>
  <h1>Metadata-Next</h1>
  <button class="toggle" id="mode" role="switch" aria-checked="false" aria-label="Dark mode">
    <span class="knob">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </span>
  </button>
</header>

<main>
  <section class="box">
    <div class="toolbar">
      <div class="group">
        <button class="btn" id="upload">Upload</button>
        <button class="btn sq" id="clear" aria-label="Delete all images" hidden><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M8 6V4h8v2"/><path d="M10 11v6M14 11v6"/></svg></button>
      </div>
      <div class="count" id="count">0 - Image</div>
      <div class="group right">
        <button class="btn" id="gen" hidden>Generate</button>
        <button class="btn" id="dl" hidden>Download</button>
      </div>
    </div>
    <div class="scroll"><div class="grid" id="grid"></div></div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </section>
</main>

<div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" hidden>
  <div class="mbox">
    <h2 id="mTitle">Duplicate image</h2>
    <p id="mText"></p>
    <button class="btn" id="mOk">OK</button>
  </div>
</div>

<script>
const root=document.documentElement,modeBtn=document.getElementById('mode');
modeBtn.addEventListener('click',()=>{
  const dark=root.dataset.theme!=='dark';
  root.dataset.theme=dark?'dark':'light';
  modeBtn.setAttribute('aria-checked',dark);
});

let imgs=[];
const $=id=>document.getElementById(id),file=$('file'),grid=$('grid');
function render(){
  const n=imgs.length,has=n>0;
  $('clear').hidden=$('gen').hidden=$('dl').hidden=!has;
  $('count').textContent=n===0?'0 - Image':String(n).padStart(2,'0')+(n===1?' - Image':' - Images');
  grid.innerHTML='';
  imgs.forEach((u,idx)=>{
    const c=document.createElement('div');c.className='card';
    const t=document.createElement('div');t.className='tile';
    const i=document.createElement('img');i.src=u;i.alt='Uploaded image '+(idx+1);
    t.appendChild(i);
    const d=document.createElement('button');d.className='del';d.textContent='Delete';
    d.setAttribute('aria-label','Delete image '+(idx+1));
    d.addEventListener('click',()=>{imgs.splice(idx,1);render();});
    c.append(t,d);grid.appendChild(c);
  });
}
$('upload').addEventListener('click',()=>file.click());
const readFile=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res({name:f.name,data:r.result});r.onerror=()=>res(null);r.readAsDataURL(f);});
file.addEventListener('change',async()=>{
  const fs=[...file.files].filter(f=>f.type.startsWith('image/'));
  file.value='';
  const items=(await Promise.all(fs.map(readFile))).filter(Boolean);
  const dups=[];
  items.forEach(it=>{if(imgs.includes(it.data))dups.push(it.name);else imgs.push(it.data);});
  render();
  if(dups.length)showModal(dups);
});
const modal=$('modal');
function showModal(names){
  $('mText').textContent=names.length===1
    ?'“'+names[0]+'” was not added because it has already been uploaded.'
    :names.length+' images were not added because they have already been uploaded:\n'+names.slice(0,5).join('\n')+(names.length>5?'\n+'+(names.length-5)+' more':'');
  modal.hidden=false;$('mOk').focus();
}
$('mOk').addEventListener('click',()=>{modal.hidden=true;});
modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true;});
$('clear').addEventListener('click',()=>{imgs=[];render();});
render();
</script>
</body>
</html>
